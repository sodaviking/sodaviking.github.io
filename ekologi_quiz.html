<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ekologi Quiz</title><style>
:root{color-scheme:dark;--green:#a4ff86;--bg:#091711;--card:#14271d;--muted:#a9c3b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#214932 0%,transparent 48%),radial-gradient(ellipse at 100% 100%,#16392b 0%,transparent 40%),var(--bg);color:#f4fff4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:var(--muted);font-weight:700;letter-spacing:.08em;font-size:.8rem}.pill{border:1px solid #477253;border-radius:999px;padding:9px 14px}.card{background:linear-gradient(145deg,#1b3325,#10231a);border:1px solid #345840;border-radius:28px;padding:clamp(24px,5vw,48px);box-shadow:0 30px 100px #0008}.eyebrow{color:var(--green);font-size:.85rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.5rem,8vw,4.6rem);letter-spacing:-.065em;line-height:1.04;margin:12px 0 18px}h2{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.25;margin:20px 0 28px;letter-spacing:-.035em}p{color:var(--muted);line-height:1.6}.accent{color:var(--green)}button{font:inherit;cursor:pointer}.primary{background:var(--green);border:0;color:#102218;font-weight:900;padding:17px 24px;border-radius:15px;transition:.15s}.primary:hover{transform:translateY(-2px);filter:brightness(1.06)}.choices{display:grid;gap:12px}.choice{text-align:left;background:#20392a;border:1px solid #3d6148;color:#fff;border-radius:15px;padding:17px 20px;font-size:1rem;transition:.16s}.choice:hover:not(:disabled){background:#2c4a36;border-color:var(--green);transform:translateY(-1px)}.choice.correct{background:#235c38;border-color:var(--green)}.choice.wrong{background:#603036;border-color:#ff9292}.choice:disabled{cursor:default}.progress{height:8px;background:#2b4633;border-radius:20px;overflow:hidden;margin:22px 0 28px}.progress>div{height:100%;background:linear-gradient(90deg,#5cdb82,#c6ff87);width:0;transition:width .3s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.feedback{min-height:26px;margin:18px 0;color:#cce8d0;font-weight:650}.hidden{display:none}.big{font-size:clamp(4rem,15vw,7rem);font-weight:900;letter-spacing:-.09em;margin:10px 0}.center{text-align:center}.badge{display:inline-block;border-radius:100px;padding:10px 17px;background:#2d5735;color:#bfff9b;font-weight:800;margin:10px 0 24px}footer{text-align:center;color:#638a71;font-size:.75rem;margin-top:20px}button:focus-visible{outline:3px solid white;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="wrap"><div class="top"><span>🌿 EKOLOGI</span><span class="pill" id="counter">26 FRÅGOR</span></div><section class="card" id="start"><div class="eyebrow">ÅRSKURS 8</div><h1>Hur bra kan du <span class="accent">ekologi?</span></h1><p>26 frågor. Minst 20 rätt för att klara quizet.</p><button class="primary" id="startBtn">STARTA QUIZ →</button></section><section class="card hidden" id="game"><div class="row"><span class="eyebrow" id="category"></span><span id="scoreText">0 POÄNG</span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="row"><span id="number" style="color:var(--muted)"></span><button class="primary hidden" id="next">NÄSTA →</button></div></section><section class="card center hidden" id="end"><div class="eyebrow">RESULTAT</div><div class="big" id="finalScore"></div><h2 id="resultTitle"></h2><div class="badge" id="resultBadge"></div><p id="resultText"></p><br><button class="primary" id="retry">SPELA IGEN ↻</button></section><footer>🌱</footer></main><script>
const questions=[["Liv i samspel","En sjö får varmare vatten under sommaren. Vad kan det leda till?",["Fiskar kan få svårare att överleva när syrehalten i vattnet sjunker.","Fiskar kan få lättare att överleva när syrehalten i vattnet sjunker.","Växterna kan sluta behöva solljus när vattnets temperatur stiger.","Nedbrytarna kan sluta påverka sjön när temperaturen stiger."],0,"Varmt vatten kan innehålla mindre syre, vilket påverkar fiskarna."],["Liv i samspel","Två fågelarter äter samma insekter. När blir konkurrensen störst?",["När det finns gott om insekter och arterna äter på olika platser.","När det finns ont om insekter och arterna söker föda på samma plats.","När det finns ont om insekter men arterna äter helt olika föda.","När det finns gott om insekter och arterna har olika livsmiljöer."],1,"Konkurrensen ökar när resurser är begränsade och arterna behöver samma sak."],["Liv i samspel","En hackspett lever i en skog och äter insekter i träd. Vilket påstående stämmer?",["Insekterna är hackspettens habitat och skogen är dess population.","Träden är hackspettens population och insekterna dess samhälle.","Skogen är hackspettens habitat och dess sätt att söka föda ingår i nischen.","Skogen är hackspettens nisch och alla fåglar utgör dess habitat."],2,"Habitat är platsen där en art lever; nisch handlar om hur den lever."],["Liv i samspel","En lång torka gör att en damm nästan försvinner. Vad är en rimlig följd?",["Fler grodor överlever eftersom mindre vatten alltid ger mer föda.","Grodan påverkas inte eftersom vatten är en abiotisk faktor.","Alla arter försvinner direkt eftersom inga organismer tål torka.","Grodornas fortplantning kan försvåras när deras lekplatser minskar."],3,"Vatten är en abiotisk faktor som kan påverka grodornas fortplantning."],["Liv i samspel","Vad är skillnaden mellan en population och ett samhälle i en skog?",["En population är alla rådjur; ett samhälle är alla olika populationer.","En population är alla djur; ett samhälle är alla träd i skogen.","En population är alla arter; ett samhälle är alla rådjur i skogen.","En population är alla växter; ett samhälle är skogens temperatur."],0,"En population består av individer av samma art i ett område."],["Liv i samspel","En ny växt sprider sig på en äng. Vad kan hända med andra växter?",["De får automatiskt mer solljus eftersom antalet växter ökar.","De kan få mindre ljus och plats om den nya växten konkurrerar med dem.","De påverkas inte eftersom konkurrens bara sker mellan djurarter.","De slutar använda vatten eftersom den nya växten tar upp vatten."],1,"Växter kan konkurrera om ljus, vatten, näring och utrymme."],["Liv i samspel","Vilket exempel visar att en biotisk faktor påverkar en population?",["En kall vinter gör att många småfåglar får svårare att hitta mat.","En torr sommar gör att växterna i skogen växer långsammare.","Fler rävar jagar harar, vilket kan minska antalet harar.","Mindre solljus gör att fotosyntesen hos växter går långsammare."],2,"Rävar är levande organismer och därför en biotisk faktor."],["Energi och materia","Varifrån kommer mycket av kolet som bygger upp ett växande träd?",["Från solljuset som trädet tar upp med hjälp av sina blad.","Från syret som trädet tar upp när det utför cellandning.","Från mineralerna som trädet tar upp genom sina rötter.","Från koldioxiden i luften som används vid fotosyntesen."],3,"Växter använder kol från luftens koldioxid för att bygga socker och biomassa."],["Energi och materia","Varför behöver växter både fotosyntes och cellandning?",["Fotosyntes bygger socker och cellandning frigör energi ur sockret.","Fotosyntes frigör energi och cellandning skapar nytt solljus.","Fotosyntes bryter ner socker och cellandning tillverkar koldioxid.","Fotosyntes sker bara på natten och cellandning bara på dagen."],0,"Fotosyntes lagrar energi i socker; cellandning frigör användbar energi."],["Energi och materia","I kedjan gräs → gräshoppa → groda minskar gräshopporna. Vad kan ske?",["Gräset kan minska och grodorna öka när gräshopporna blir färre.","Gräset kan öka och grodorna minska när gräshopporna blir färre.","Gräset kan minska och grodorna minska eftersom gräset äts mindre.","Gräset kan öka och grodorna öka eftersom grodorna får mer föda."],1,"Färre gräshoppor kan innebära mindre bete på gräs och mindre mat åt grodor."],["Energi och materia","Varför finns det oftast färre rovdjur än växtätare i en näringskedja?",["Rovdjuren använder inte energi till rörelse och andra livsprocesser.","Producenterna kan inte omvandla solljus till energi som djur kan använda.","Mycket energi används eller blir värme innan den når högre trofinivåer.","All energi lagras i växtätarna och ingen energi kan gå till rovdjur."],2,"Mindre energi finns tillgänglig på högre trofinivåer."],["Energi och materia","Varför kan ett miljögift finnas i högre halter hos en rovfisk?",["Rovfisken producerar giftet själv när den simmar snabbt i vattnet.","Giftet blir ofarligt hos småfisk men återbildas i stora fiskar.","Giftet stannar bara i vattnet och påverkar inte fiskarnas kroppar.","Giftet kan lagras i bytesdjur och ansamlas när rovfisken äter dem."],3,"Svårnedbrytbara ämnen kan anrikas uppåt i näringskedjan."],["Energi och materia","Vad händer när svampar och bakterier bryter ner döda löv?",["Näringsämnen frigörs och kan åter användas av växter i ekosystemet.","Näringsämnen försvinner och kan inte användas av växter igen.","All energi från löven blir till nytt solljus som växter kan fånga.","Allt kol i löven stannar för alltid kvar i nedbrytarnas kroppar."],0,"Nedbrytare gör att ämnen kan återgå till kretsloppet."],["Energi och materia","En rådjurspopulation ökar men slutar sedan växa. Vad kan förklara det?",["Rådjuren har slutat behöva föda eftersom de har blivit fler.","Föda och utrymme räcker inte längre för att populationen ska öka.","Rådjuren har blivit producenter och behöver därför mindre energi.","Rådjuren kan inte längre påverkas av rovdjur eller sjukdomar."],1,"Miljöns bärförmåga begränsar populationens storlek."],["Energi och materia","Vad kan hända om mängden växtplankton minskar kraftigt i en sjö?",["Rovfiskar får automatiskt mer föda när producenterna blir färre.","Konsumenterna påverkas inte eftersom växtplankton inte ger energi.","Djur som äter plankton kan få mindre mat, vilket även påverkar fiskar.","Alla fiskar börjar fotosyntetisera när växtplankton blir ovanligare."],2,"Producenterna är grunden för energiflödet i många näringsvävar."],["Förändringar","Ett diagram visar först fler harar och sedan fler rävar. Varför?",["Rävar blir fler först när växterna slutar växa i hela området.","Harar ökar alltid när rävar blir fler eftersom rovdjur skyddar dem.","Rävar och harar påverkar aldrig varandra eftersom de är olika arter.","Fler harar ger rävarna mer mat så att fler rävar kan överleva."],3,"Rovdjurens population kan öka efter att bytesdjuren blivit fler."],["Förändringar","Efter kraftig algblomning dör många fiskar i en sjö. Varför kan det ske?",["Nedbrytning av döda alger förbrukar syre som fiskarna behöver.","Algerna använder allt syre till fotosyntes så att fiskarna får mer syre.","Nedbrytarna slutar andas och syret i sjön försvinner omedelbart.","Fiskarna kan inte längre äta eftersom algblomning tar bort solljuset."],0,"När mycket organiskt material bryts ner kan syrebrist uppstå."],["Förändringar","En population växer snabbt och minskar sedan. Vilken förklaring är rimlig?",["Populationen får alltid fler resurser när antalet individer ökar.","Resurserna kan ha blivit otillräckliga när populationen blev stor.","Alla individer kan ha bytt art när populationen nådde sin högsta nivå.","Populationen kan ha slutat påverkas av miljön när den växte."],1,"Resursbrist och konkurrens kan minska en stor population."],["Förändringar","En invasiv växt breder ut sig i en skog. Vad kan bli följden?",["Alla djur blir fler eftersom fler växter alltid betyder mer föda.","Alla växter får mer ljus eftersom den invasiva växten sprider sig.","Andra växter kan trängas undan om den nya arten tar ljus och plats.","Andra växter påverkas inte eftersom olika arter aldrig konkurrerar."],2,"Invasiva arter kan konkurrera med inhemska arter om resurser."],["Förändringar","Ett diagram visar att en population pendlar kring ungefär samma nivå. Vad kan det tyda på?",["Populationen växer utan begränsning men syns inte tydligt i diagrammet.","Alla individer lever lika länge och därför ändras aldrig populationen.","Ekosystemet har inga rovdjur, sjukdomar eller förändringar i resurser.","Födelsetal och dödstal varierar medan resurserna begränsar tillväxten."],3,"Populationer kan variera kring miljöns bärförmåga."],["Hållbar utveckling","Varför kan en äng med många växtarter vara mindre sårbar än en monokultur?",["Olika arter kan reagera olika på torka och angrepp av skadedjur.","Alla arter har exakt samma behov och klarar därför torka lika bra.","Fler arter gör att växterna inte längre behöver vatten eller solljus.","En monokultur innehåller alltid fler livsmiljöer än en varierad äng."],0,"Biologisk mångfald kan bidra till att ekosystem klarar förändringar."],["Hållbar utveckling","Varför är pollinerande insekter en viktig ekosystemtjänst?",["De gör att växterna inte längre behöver fotosyntes för att växa.","De hjälper många blomväxter att bilda frön och frukter.","De ersätter nedbrytare genom att omvandla döda växter till jord.","De ser till att alla växter kan sprida frön utan vind eller djur."],1,"Pollinering hjälper många växter att fortplanta sig."],["Hållbar utveckling","Vad kan en kommun göra för att minska översvämningsrisken naturligt?",["Asfaltera fler grönytor så att regnet snabbt rinner vidare.","Ta bort växter längs vattendrag så att marken blir bar.","Bevara våtmarker som kan hålla kvar vatten efter kraftigt regn.","Bygga fler hus nära vattnet så att regnet får mindre plats."],2,"Våtmarker kan lagra och fördröja vatten vid kraftig nederbörd."],["Hållbar utveckling","Vilket val kan minska ditt ekologiska fotavtryck?",["Köpa nya kläder ofta så att produktionen behöver fler råvaror.","Slänga mer mat så att livsmedelsproduktionen behöver öka.","Byta fungerande elektronik varje år för att få nyare modeller.","Använda saker längre och minska matsvinn för att spara resurser."],3,"Mindre matsvinn och längre användning minskar resursbehovet."],["Hållbar utveckling","En skog ersätts med en odling av en enda trädart. Vad kan bli följden?",["Färre typer av livsmiljöer kan göra att vissa arter minskar.","Fler typer av livsmiljöer bildas alltid när bara en art odlas.","Alla djur får samma föda eftersom träden är av samma art.","Nedbrytarna försvinner helt eftersom alla träden är likadana."],0,"Monokultur ger ofta mindre variation i livsmiljöer."],["Hållbar utveckling","Hur kan fiske bli mer hållbart på lång sikt?",["Fånga så många fiskar som möjligt innan beståndet minskar.","Anpassa fångsterna efter fiskbeståndet och skydda lekplatser.","Fiska extra mycket under lekperioden när fiskarna samlas.","Ta bort alla rovfiskar så att småfiskar aldrig blir uppätna."],1,"Hållbart fiske tar hänsyn till hur snabbt bestånden kan återhämta sig."]];
let order=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function begin(){order=questions.map((q,i)=>i).sort(()=>Math.random()-.5);index=0;score=0;show('game');render()}function render(){locked=false;let q=questions[order[index]];$('category').textContent=q[0];$('scoreText').textContent=score+' POÄNG';$('question').textContent=q[1];$('bar').style.width=(index/questions.length*100)+'%';$('number').textContent=`${index+1} / ${questions.length}`;$('feedback').textContent='';$('next').classList.add('hidden');let choices=$('choices');choices.innerHTML='';let shuffled=q[2].map((v,i)=>({v,i})).sort(()=>Math.random()-.5);shuffled.forEach(({v,i})=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(i,b);choices.append(b)})}function answer(pick,button){if(locked)return;locked=true;let q=questions[order[index]],correct=pick===q[3];if(correct)score++;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(!correct)button.classList.add('wrong');$('scoreText').textContent=score+' POÄNG';$('feedback').textContent=(correct?'✓ Rätt! ':'✕ Inte riktigt. ')+q[4];$('next').textContent=index===questions.length-1?'SE RESULTAT →':'NÄSTA →';$('next').classList.remove('hidden')}
function victorySound(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let now=ctx.currentTime;[[523.25,0,.18],[659.25,.13,.18],[783.99,.26,.22],[1046.5,.43,.7]].forEach(([freq,start,duration])=>{let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(.18,now+start+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);osc.connect(gain).connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+.02)});setTimeout(()=>ctx.close(),1800)}catch(e){}}
function finish(){show('end');$('counter').textContent='KLART';$('finalScore').textContent=score+' / '+questions.length;let won=score>=20;$('resultTitle').textContent=won?'🎉 DU KLARADE DET!':'🌿 NÄSTAN DÄR!';$('resultBadge').textContent=won?'GODKÄND ✓':'FÖRSÖK IGEN';$('resultText').textContent=won?'Snyggt jobbat!':'Du behöver minst 20 rätt. Kör igen!';if(won)victorySound()}
$('startBtn').onclick=begin;$('retry').onclick=()=>{$('counter').textContent='26 FRÅGOR';begin()};$('next').onclick=()=>{index++;index<questions.length?render():finish()};
</script></body></html>
