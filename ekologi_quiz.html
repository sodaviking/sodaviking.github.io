<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ekologi Quiz</title><style>
:root{color-scheme:dark;--green:#a4ff86;--bg:#091711;--card:#14271d;--muted:#a9c3b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#214932 0%,transparent 48%),radial-gradient(ellipse at 100% 100%,#16392b 0%,transparent 40%),var(--bg);color:#f4fff4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,760px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:var(--muted);font-weight:700;letter-spacing:.08em;font-size:.8rem}.pill{border:1px solid #477253;border-radius:999px;padding:9px 14px}.card{background:linear-gradient(145deg,#1b3325,#10231a);border:1px solid #345840;border-radius:28px;padding:clamp(24px,5vw,48px);box-shadow:0 30px 100px #0008}.eyebrow{color:var(--green);font-size:.85rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.5rem,8vw,4.6rem);letter-spacing:-.065em;line-height:1.04;margin:12px 0 18px}h2{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.25;margin:20px 0 28px;letter-spacing:-.035em}p{color:var(--muted);line-height:1.6}.accent{color:var(--green)}button{font:inherit;cursor:pointer}.primary{background:var(--green);border:0;color:#102218;font-weight:900;padding:17px 24px;border-radius:15px;transition:.15s}.primary:hover{transform:translateY(-2px);filter:brightness(1.06)}.choices{display:grid;gap:12px}.choice{text-align:left;background:#20392a;border:1px solid #3d6148;color:#fff;border-radius:15px;padding:17px 20px;font-size:1rem;transition:.16s}.choice:hover:not(:disabled){background:#2c4a36;border-color:var(--green);transform:translateY(-1px)}.choice.correct{background:#235c38;border-color:var(--green)}.choice.wrong{background:#603036;border-color:#ff9292}.choice:disabled{cursor:default}.progress{height:8px;background:#2b4633;border-radius:20px;overflow:hidden;margin:22px 0 28px}.progress>div{height:100%;background:linear-gradient(90deg,#5cdb82,#c6ff87);width:0;transition:width .3s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.feedback{min-height:26px;margin:18px 0;color:#cce8d0;font-weight:650}.hidden{display:none}.big{font-size:clamp(4rem,15vw,7rem);font-weight:900;letter-spacing:-.09em;margin:10px 0}.center{text-align:center}.badge{display:inline-block;border-radius:100px;padding:10px 17px;background:#2d5735;color:#bfff9b;font-weight:800;margin:10px 0 24px}footer{text-align:center;color:#638a71;font-size:.75rem;margin-top:20px}button:focus-visible{outline:3px solid white;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="wrap"><div class="top"><span>🌿 EKOLOGI QUIZ</span><span class="pill" id="counter">26 FRÅGOR</span></div><section class="card" id="start"><div class="eyebrow">NO • EKOLOGI</div><h1>Hur bra kan du <span class="accent">ekologi?</span></h1><p>26 frågor. Fyra områden. Klara minst 20 för att vinna.</p><button class="primary" id="startBtn">STARTA QUIZ →</button></section><section class="card hidden" id="game"><div class="row"><span class="eyebrow" id="category"></span><span id="scoreText">0 POÄNG</span></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="row"><span id="number" style="color:var(--muted)"></span><button class="primary hidden" id="next">NÄSTA →</button></div></section><section class="card center hidden" id="end"><div class="eyebrow">RESULTAT</div><div class="big" id="finalScore"></div><h2 id="resultTitle"></h2><div class="badge" id="resultBadge"></div><p id="resultText"></p><br><button class="primary" id="retry">SPELA IGEN ↻</button></section><footer>🌱</footer></main><script>
const questions=[
['Liv i samspel','Vad är ekologi?',['Läran om samspelet mellan organismer och miljö','Läran om stenar','Läran om väder'],0,'Ekologi handlar om samspelet mellan organismer och deras omgivning.'],
['Liv i samspel','Vad är ett ekosystem?',['Bara alla djur i en skog','Organismer och den miljö de samspelar med','Bara jord och vatten'],1,'Ekosystem omfattar både levande och icke-levande delar.'],
['Liv i samspel','Vilken faktor är abiotisk?',['Räv','Svamp','Temperatur'],2,'Temperatur är en icke-levande miljöfaktor.'],
['Liv i samspel','Vilken faktor är biotisk?',['Solljus','Bakterier','Vind'],1,'Bakterier är levande organismer.'],
['Liv i samspel','Vad betyder population?',['Alla individer av samma art i ett område','Alla arter på jorden','Alla växter i ett land'],0,'En population består av individer av samma art i ett visst område.'],
['Liv i samspel','Vad är ett samhälle inom ekologi?',['Alla populationer av olika arter i ett område','En stad med hus','En enda djurart'],0,'Ett ekologiskt samhälle består av populationer av olika arter.'],
['Liv i samspel','Vad är ett habitat?',['En organisms föda','Platsen där en organism lever','En organisms fiender'],1,'Habitatet är organismens livsmiljö.'],
['Liv i samspel','Vad beskriver en ekologisk nisch?',['Artens roll, resursanvändning och levnadssätt','Artens färg','Hur många ungar arten får'],0,'Nischen beskriver hur arten lever och använder resurser.'],
['Liv i samspel','Vad händer ofta när två arter behöver samma begränsade föda?',['De konkurrerar','Båda försvinner direkt','Det bildas mer föda automatiskt'],0,'Brist på resurser leder till konkurrens.'],
['Liv i samspel','Vad är en biotop?',['Ett område med särskilda miljöförhållanden och typiskt växt- och djurliv','En enda individ','En typ av näringskedja'],0,'Exempel på biotoper är myrar och ängar.'],
['Energi och materia','Vad behövs för fotosyntesen?',['Syre och socker','Koldioxid, vatten och ljus','Bara jord'],1,'Växter använder ljusenergi för att bilda socker och syre av koldioxid och vatten.'],
['Energi och materia','Vad sker vid cellandning?',['Socker bryts ner med syre och energi frigörs','Solljus bildas','Koldioxid blir automatiskt socker'],0,'Cellandning frigör användbar energi ur socker.'],
['Energi och materia','Vilken organism är en producent?',['Gräs','Hare','Räv'],0,'Gräs tillverkar energirika ämnen genom fotosyntes.'],
['Energi och materia','Vilken roll har nedbrytare?',['De återför näringsämnen genom nedbrytning','De skapar solljus','De stoppar kretslopp'],0,'Nedbrytare gör att ämnen kan återanvändas i naturen.'],
['Energi och materia','Vilken näringskedja är rimlig?',['Räv → gräs → hare','Gräs → hare → räv','Hare → räv → gräs'],1,'Pilarna visar energins väg från föda till den som äter.'],
['Energi och materia','Vad är en näringsväv?',['Flera sammanlänkade näringskedjor','En enda växt','Ett moln av vatten'],0,'Näringsvävar visar hur många arter hänger ihop via föda.'],
['Energi och materia','Varför finns oftast färre toppkonsumenter än producenter?',['Energi går förlorad mellan trofinivåerna','Toppkonsumenter gör fotosyntes','Energin ökar uppåt'],0,'Mycket energi används och avges som värme på varje nivå.'],
['Energi och materia','Vad betyder biomassa?',['Den sammanlagda massan av levande material','Mängden solljus','Antalet berg'],0,'Biomassa beskriver massan av organiskt material.'],
['Energi och materia','Vad är anrikning i en näringskedja?',['Vissa svårnedbrytbara ämnen blir mer koncentrerade högre upp','Allt gift försvinner hos rovdjur','Energin ökar för varje steg'],0,'Vissa miljögifter kan ansamlas och få högre halter hos toppkonsumenter.'],
['Energi och materia','Vad menas med ekosystemets bärförmåga?',['Hur många individer miljön kan försörja över tid','Hur tungt ett träd är','Hur mycket en fågel kan lyfta'],0,'Tillgången på resurser begränsar populationens storlek.'],
['Förändringar','Om antalet rävar minskar kraftigt, vad kan först hända med hararna?',['De kan öka','De måste minska','De blir producenter'],0,'Färre rovdjur kan ge fler bytesdjur, om andra faktorer är oförändrade.'],
['Förändringar','En population växer snabbt och minskar sedan. Vilken förklaring är rimlig?',['Resurserna tog slut och konkurrensen ökade','Populationer påverkas aldrig av mat','Alla individer slutade behöva energi'],0,'När resurserna inte räcker kan överlevnad och fortplantning minska.'],
['Bruka utan att förbruka','Vad är en ekosystemtjänst?',['Nyttor som naturens ekosystem ger oss','En tjänst som bara människor säljer','En sorts maskin'],0,'Pollinering, vattenrening och bördig jord är exempel.'],
['Bruka utan att förbruka','Vad innebär biologisk mångfald?',['Variation av gener, arter och ekosystem','Bara många träd av samma art','Att alla djur är lika'],0,'Mångfald finns på flera nivåer.'],
['Bruka utan att förbruka','Varför kan en monokultur vara känslig?',['En sjukdom kan drabba många liknande växter','Den innehåller alltid flest arter','Den behöver aldrig näring'],0,'Låg variation kan göra odlingen sårbar.'],
['Bruka utan att förbruka','Vad minskar oftast vårt ekologiska fotavtryck?',['Att slänga mer mat','Att använda resurser effektivt och minska matsvinn','Att köpa mer än vi behöver'],1,'Mindre resursförbrukning och matsvinn minskar belastningen på naturen.']
];
let order=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(id){['start','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function begin(){order=questions.map((q,i)=>i).sort(()=>Math.random()-.5);index=0;score=0;show('game');render()}function render(){locked=false;let q=questions[order[index]];$('category').textContent=q[0];$('scoreText').textContent=score+' POÄNG';$('question').textContent=q[1];$('bar').style.width=(index/questions.length*100)+'%';$('number').textContent=`${index+1} / ${questions.length}`;$('feedback').textContent='';$('next').classList.add('hidden');let choices=$('choices');choices.innerHTML='';let shuffled=q[2].map((v,i)=>({v,i})).sort(()=>Math.random()-.5);shuffled.forEach(({v,i})=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(i,b);choices.append(b)})}function answer(pick,button){if(locked)return;locked=true;let q=questions[order[index]],correct=pick===q[3];if(correct)score++;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(!correct)button.classList.add('wrong');$('scoreText').textContent=score+' POÄNG';$('feedback').textContent=(correct?'✓ Rätt! ':'✕ Inte riktigt. ')+q[4];$('next').textContent=index===questions.length-1?'SE RESULTAT →':'NÄSTA →';$('next').classList.remove('hidden')}
function victorySound(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let now=ctx.currentTime;[[523.25,0,.18],[659.25,.13,.18],[783.99,.26,.22],[1046.5,.43,.7]].forEach(([freq,start,duration])=>{let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(.18,now+start+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);osc.connect(gain).connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+.02)});setTimeout(()=>ctx.close(),1800)}catch(e){}}
function finish(){show('end');$('counter').textContent='KLART';$('finalScore').textContent=score+' / '+questions.length;let won=score>=20;$('resultTitle').textContent=won?'🎉 DU KLARADE DET!':'🌿 NÄSTAN DÄR!';$('resultBadge').textContent=won?'GODKÄND ✓':'FÖRSÖK IGEN';$('resultText').textContent=won?'Snyggt jobbat!':'Du behöver minst 20 rätt. Kör igen!';if(won)victorySound()}
$('startBtn').onclick=begin;$('retry').onclick=()=>{$('counter').textContent='26 FRÅGOR';begin()};$('next').onclick=()=>{index++;index<questions.length?render():finish()};
</script></body></html>
