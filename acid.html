<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz – Syror och baser</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}header,.q,#result{background:#fff;border:1px solid #d8dee8;border-radius:16px;padding:22px;margin:14px 0}h1{margin:0 0 8px}.muted{color:#667085;line-height:1.5}.bar{height:9px;background:#e7ebf2;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#315efb;width:0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{background:#fff;border:1px solid #cfd6e2;border-radius:11px;padding:13px;text-align:left;font-size:15px;line-height:1.35;min-height:60px;cursor:pointer}.opt.sel{box-shadow:0 0 0 2px #dbe3ff}.opt.ok{border-color:#16803c;background:#eefaf2}.opt.no{border-color:#c62828;background:#fff0f0}.fb,.hint p{display:none;margin-top:12px;padding:11px;background:#f5f7fa;border-radius:9px;line-height:1.4}.show{display:block}.hint button,.actions button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:bold}.hint button{background:#eef2ff}.actions{display:flex;gap:10px;justify-content:center;margin:18px}.finish{background:#315efb;color:#fff}.reset{background:#fff;border:1px solid #cfd6e2!important}@media(max-width:700px){.opts{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><h1>Quiz: Syror och baser</h1><p class="muted">20 frågor på åk 8 A-nivå. Du behöver inte läsa dokumentet för att kunna svara. Quizet håller sig till områdena som tas upp: pH, indikatorer, syror, baser, joner, styrka, koncentration, neutralisation, buffertar och saltbildning.</p><div class="bar"><div id="progress"></div></div><p class="muted" id="count">0 av 20 besvarade</p></header><main id="quiz"></main><div class="actions"><button class="finish" onclick="grade()">Rätta quizet</button><button class="reset" onclick="location.reload()">Börja om</button></div><section id="result" style="display:none"></section></div>
<script>
const qs=[{"q": "Vad beskriver pH-värdet hos en vattenlösning?", "o": ["Hur varm eller kall lösningen är", "Hur sur eller basisk lösningen är", "Hur tung eller lätt lösningen är", "Hur snabbt eller långsamt lösningen rinner", "Hur färgad eller klar lösningen är", "Hur stark eller svag lösningen luktar"], "c": 1, "e": "pH beskriver hur sur eller basisk en lösning är."}, {"q": "Vilket pH-värde har en neutral vattenlösning?", "o": ["pH 9", "pH 13", "pH 1", "pH 5", "pH 3", "pH 7"], "c": 5, "e": "En neutral vattenlösning har pH 7."}, {"q": "En lösning har pH 3 och en annan pH 5. Hur skiljer sig deras surhet?", "o": ["pH 3 är hundra gånger surare", "pH 3 är fem gånger surare", "pH 3 är tusen gånger surare", "pH 3 är tio gånger surare", "pH 3 är två gånger surare", "pH 3 är tjugo gånger surare"], "c": 0, "e": "Två steg på pH-skalan motsvarar en faktor 10 × 10 = 100."}, {"q": "Vad händer med en indikators färg när pH förändras?", "o": ["Färgen kan ändras beroende på pH", "Färgen ändras alltid med temperaturen", "Färgen ändras alltid med massan", "Färgen ändras alltid med densiteten", "Färgen ändras alltid med volymen", "Färgen ändras alltid med lukten"], "c": 0, "e": "Indikatorer kan få olika färg vid olika pH."}, {"q": "Vilken är en naturlig indikator?", "o": ["Bromtymolblått", "Universell indikator", "Metylorange", "Rödkålsindikator", "Lakmuslösning", "Fenolftalein"], "c": 3, "e": "Rödkål kan användas som naturlig pH-indikator."}, {"q": "Vilken partikel är central när syrors egenskaper i vatten beskrivs?", "o": ["Natriumjoner", "Kalciumjoner", "Vätejoner", "Magnesiumjoner", "Kloridjoner", "Hydroxidjoner"], "c": 2, "e": "Syror lämnar ifrån sig vätejoner i vatten."}, {"q": "Vad kännetecknar en stark syra jämfört med en svag syra?", "o": ["Den kan aldrig lösas i vatten", "En mindre andel avger vätejoner", "Den innehåller alltid mer vatten", "En större andel avger vätejoner", "Den är alltid mer koncentrerad", "Alla blir automatiskt neutrala"], "c": 3, "e": "En stark syra bildar joner i högre grad än en svag syra."}, {"q": "Vad är skillnaden mellan stark och koncentrerad syra?", "o": ["Stark gäller färg, koncentrerad mängd vatten", "Stark gäller volym, koncentrerad mängd joner", "Stark gäller lukt, koncentrerad mängd vatten", "Stark gäller massa, koncentrerad mängd färg", "Stark gäller temperatur, koncentrerad mängd syra", "Stark gäller jonbildning, koncentrerad mängd syra"], "c": 5, "e": "Styrka och koncentration beskriver olika egenskaper."}, {"q": "Vilket är ett exempel på en svag syra i mat?", "o": ["Svavelsyra i industrin", "Salpetersyra i laboratoriet", "Saltsyra i magsäcken", "Saltsyra i rengöringsmedel", "Ättiksyra i vinäger", "Svavelsyra i bilbatterier"], "c": 4, "e": "Ättiksyra är en svag syra och finns i vinäger."}, {"q": "Vilken av dessa är en stark syra?", "o": ["Saltsyra", "Kolsyra", "Mjölksyra", "Citronsyra", "Ättiksyra", "Myrsyra"], "c": 0, "e": "Saltsyra räknas som en stark syra."}, {"q": "Vad betyder det att en syra är utspädd?", "o": ["Kan inte bilda joner", "Mycket syra per mängd lösning", "Lite syra per mängd lösning", "Alltid starkare syra", "Alltid neutralt pH", "Alltid fler hydroxidjoner"], "c": 2, "e": "En utspädd lösning innehåller mindre löst ämne per mängd lösning."}, {"q": "Vilken jon förknippas med basiska lösningars egenskaper?", "o": ["Kalciumjonen", "Kloridjonen", "Hydroxidjonen", "Magnesiumjonen", "Vätejonen", "Natriumjonen"], "c": 2, "e": "Hydroxidjonen, OH⁻, är central för basiska lösningar."}, {"q": "Vad kännetecknar en stark bas jämfört med en svag bas?", "o": ["Den har alltid lägre pH", "Den bildar fler hydroxidjoner i vatten", "Den är alltid mer utspädd", "Den bildar färre hydroxidjoner i vatten", "Den är alltid färglös", "Den innehåller alltid mer vatten"], "c": 1, "e": "En stark bas ger upphov till högre halt hydroxidjoner under jämförbara förhållanden."}, {"q": "Vad betyder en koncentrerad bas?", "o": ["Alltid neutralt pH", "Mer bas per mängd lösning", "Alltid svagare bas", "Kan aldrig lösas i vatten", "Alltid fler vätejoner", "Mindre bas per mängd lösning"], "c": 1, "e": "Koncentration beskriver mängden löst ämne per mängd lösning."}, {"q": "Vilken är en svag bas?", "o": ["Natriumhydroxidlösning", "En stark hydroxidlösning", "Bariumhydroxidlösning", "Kaliumhydroxidlösning", "Litiumhydroxidlösning", "Ammoniaklösning"], "c": 5, "e": "Ammoniak i vatten bildar en svag basisk lösning."}, {"q": "Vad är neutralisation?", "o": ["En reaktion mellan en syra och en bas", "En filtrering av salt", "En färgförändring i papper", "En avdunstning till luft", "En uppvärmning av vatten", "En mätning med en indikator"], "c": 0, "e": "Vid neutralisation reagerar en syra och en bas så att deras egenskaper motverkas."}, {"q": "Vad är en viktig funktion hos en buffert?", "o": ["Att göra lösningen starkt basisk", "Att bara ändra lösningens färg", "Att göra lösningen starkt sur", "Att göra lösningen helt neutral", "Att motverka stora pH-förändringar", "Att alltid höja temperaturen"], "c": 4, "e": "En buffert hjälper till att hålla pH relativt stabilt."}, {"q": "Var är buffertsystem viktiga i kroppen?", "o": ["I naglarnas längdreglering", "I hårets färgreglering", "I ögonfransarnas densitet", "I blodets pH-reglering", "I skelettets temperaturreglering", "I hudens volymreglering"], "c": 3, "e": "Buffertsystem hjälper till att hålla blodets pH inom ett stabilt område."}, {"q": "Vad bildas när saltsyra och natriumhydroxid neutraliserar varandra?", "o": ["Saltsyra och natriumperoxid", "Väteklorid och natrium", "Natriumklorid och vatten", "Klor och natriumvatten", "Natrium och hydroxidvatten", "Natriumoxid och väte"], "c": 2, "e": "HCl + NaOH → NaCl + H₂O."}, {"q": "Vilken beskrivning av pH-skalan är korrekt?", "o": ["pH 14 är starkt surt och pH 7 basiskt", "Lägre pH är basiskare, högre pH är surare", "pH 7 är starkt surt och pH 1 neutralt", "Lägre pH är surare, högre pH är basiskare", "pH visar bara temperatur", "Alla pH-värden betyder samma surhet"], "c": 3, "e": "Lägre pH betyder surare lösning, pH 7 är neutralt och högre pH betyder mer basisk lösning."}];
const picked={};
function build(){const root=document.getElementById('quiz');qs.forEach((x,n)=>{let s=document.createElement('section');s.className='q';s.innerHTML='<b>Fråga '+(n+1)+' av 20</b><h3>'+x.q+'</h3><div class="opts"></div><div class="fb"></div><div class="hint"><button>Visa ledtråd</button><p>Fundera på vad frågan faktiskt ber om och jämför alla alternativ med begreppet.</p></div>';let box=s.querySelector('.opts');x.o.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+t;b.onclick=()=>choose(n,i);box.appendChild(b)});s.querySelector('.hint button').onclick=e=>e.target.nextElementSibling.classList.toggle('show');root.appendChild(s)})}
function choose(n,i){picked[n]=i;document.querySelectorAll('.q')[n].querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));update()}
function update(){let n=Object.keys(picked).length;document.getElementById('count').textContent=n+' av 20 besvarade';document.getElementById('progress').style.width=n/20*100+'%'}
function grade(){let score=0;document.querySelectorAll('.q').forEach((s,n)=>{let x=qs[n],bs=s.querySelectorAll('.opt'),fb=s.querySelector('.fb');bs.forEach((b,i)=>{b.classList.remove('ok','no');if(i===x.c)b.classList.add('ok');if(picked[n]===i&&i!==x.c)b.classList.add('no')});if(picked[n]===x.c){score++;fb.textContent='Förklaring: '+x.e}else if(picked[n]===undefined)fb.textContent='Obesvarad. Det rätta alternativet är markerat i grönt.';else fb.textContent='Förklaring: '+x.e;fb.classList.add('show')});let r=document.getElementById('result');r.innerHTML='<h2>Resultat</h2><p>Du fick <strong>'+score+' av 20</strong> rätt ('+Math.round(score/20*100)+' %).</p>';r.style.display='block';r.scrollIntoView({behavior:'smooth'})}
build();update();
</script></body></html>
